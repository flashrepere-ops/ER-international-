<style>
:root{--bg:#0B1535;--card:#142048;--deep:#0A1129;--gold:#E8B612;--ink:#fff;--mute:#9FB0D8;--ok:#2FD39A;--bad:#F87171}

body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:84px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--deep);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}

.sp-c::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(transparent 0,#F5C518 30%,transparent 55%,#F5C518 80%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:spin 1.8s linear infinite}
.sp-c::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulse 1.4s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{box-shadow:0 0 0 0 #f5c51877}100%{box-shadow:0 0 0 38px #f5c51800}}

.sp .top b{font-size:min(3.8vw,17px)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.lg{display:flex;align-items:center;gap:8px}
.lgb{background:#F5C518;color:#0B1535;font-weight:900;border-radius:12px;padding:7px 9px;line-height:1;font-size:15px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}.pill.gld{background:#4b3600;text-align:center;line-height:1.15}
.bn{margin-top:12px;padding:10px 14px;border-radius:99px;text-align:center;font-weight:800;font-size:14px;border:1px solid}
.bn.ok{background:#12373c;color:var(--ok);border-color:#1c5f58}.bn.warn{background:#2f2f2a;color:#F7D56B;border-color:#6b5a1a}
.bell{position:relative;background:none;font-size:26px}.bell i{position:absolute;top:2px;right:2px;width:11px;height:11px;background:#F87171;border-radius:50%}
.pl{display:inline-block;background:#0B1535;color:#fff;padding:9px 16px;border-radius:99px;font-weight:700;margin:8px 0}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 3px}
nav button{font-size:11px;padding:6px 9px;min-width:52px}nav button.on{background:#1c2a5a}
.wal{display:flex;align-items:center;gap:6px;background:#1c2a5a;border:1px solid #2a3a7a;line-height:1.1;text-align:center;cursor:pointer}.wal svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.8}
.ti{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ric{font-size:28px;background:#0e1a3d;border-radius:16px;width:58px;height:58px;display:grid;place-items:center}.sp2{letter-spacing:.12em;font-weight:800}
.off{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#F7D56B;color:#0B1535;font-weight:800;font-size:12px;padding:3px 14px;border-radius:0 0 12px 12px;z-index:60;white-space:nowrap}
</style></head><body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyDYtHX2ws1otpfCa34F6dan1ncl1Q5SZg0",authDomain:"br-international-77015.firebaseapp.com",projectId:"br-international-77015",storageBucket:"br-international-77015.firebasestorage.app",messagingSenderId:"998944584250",appId:"1:998944584250:web:e5c747788e7cee0025fb03"});
const auth=getAuth(fb);let db;try{db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fb)}

/* ===== RÉGLAGES FACILES À MODIFIER ===== */
const PRIX="550 F CFA", JOURS=30;
const DATE_EXAMEN=null; // ex: "2027-06-15" quand la date officielle est connue
const FICHES=[{"id":"f1","m":"Maths","t":"Limites de fonction","min":15,"free":1,"f":"lim 1/x = 0 • lim eˣ = +∞ • lim ln x / xⁿ = 0","p":["Limites usuelles : lim 1/x = 0 (x → +∞), lim xⁿ = +∞ (n > 0).","Exponentielle / logarithme : lim eˣ = +∞ (x → +∞), lim eˣ = 0 (x → −∞), lim ln x = +∞ (x → +∞), lim ln x = −∞ (x → 0⁺).","Croissances comparées en +∞ : lim ln x / xⁿ = 0, lim xⁿ / eˣ = 0 (n > 0).","Croissances comparées : lim xⁿ eˣ = 0 (x → −∞), lim xⁿ ln x = 0 (x → 0⁺) (n > 0).","À retenir : en +∞, eˣ domine toute puissance, et toute puissance domine ln x."],"me":"Repère d’abord qui domine en +∞ : eˣ domine toute puissance, et toute puissance domine ln x.","d":"Les limites usuelles et les croissances comparées : les réflexes pour lever les formes indéterminées."},{"id":"f2","m":"Maths","t":"Probabilités","min":16,"free":1,"f":"P(Ā) = 1 − P(A) • P(X = k) = C(n,k) pᵏ (1−p)ⁿ⁻ᵏ • E(X) = np","p":["P(Ω) = 1, 0 ≤ P(A) ≤ 1 et P(Ā) = 1 − P(A).","P(A ∪ B) = P(A) + P(B) − P(A ∩ B).","Probabilité conditionnelle : P_B(A) = P(A|B) = P(A ∩ B) / P(B) si P(B) ≠ 0.","Variable aléatoire discrète : E(X) = Σ xᵢ pᵢ, V(X) = E(X²) − [E(X)]².","Loi binomiale X ~ B(n, p) : P(X = k) = C(n, k) pᵏ (1−p)ⁿ⁻ᵏ, E(X) = np, V(X) = np(1−p)."],"me":"Vérifie toujours que P(Ω) = 1 et que la somme des probabilités vaut 1.","d":"Probabilité, probabilité conditionnelle, variable aléatoire et loi binomiale : les formules à connaître par cœur."},{"id":"f3","m":"Maths","t":"Trigonométrie — Identités + Dérivées","min":14,"free":0,"f":"sin²(x) + cos²(x) = 1 • (sin x)′ = cos x • (sin u)′ = u′ cos u","p":["Identités de base : sin²(x) + cos²(x) = 1, 1 + tan²(x) = 1 / cos²(x), cos(−x) = cos(x), sin(−x) = −sin(x).","Dérivées : (sin x)′ = cos x, (cos x)′ = −sin x, (tan x)′ = 1 + tan²(x).","Règle de la chaîne : (sin u)′ = u′ cos u, (cos u)′ = −u′ sin u.","À retenir : sin(−x) change de signe, cos(−x) ne change pas.","À retenir : la dérivée de tan x s’écrit aussi 1 / cos²(x)."],"me":"Pars toujours de sin² + cos² = 1, puis dérive en pensant à la règle de la chaîne pour u.","d":"Les identités de base et les dérivées des fonctions trigonométriques, avec la règle de la chaîne."},{"id":"f4","m":"Maths","t":"Loi binomiale","min":18,"free":0,"f":"X ~ B(n ; p) • P(X = k) = C(n,k) pᵏ (1−p)ⁿ⁻ᵏ • E(X) = n·p","p":["Définition : Schéma de Bernoulli : n épreuves indépendantes, chacune avec proba p de succès (et 1−p d’échec). X = nombre de succès. On note X ~ B(n ; p).","Probabilités : Pour k entier, 0 ≤ k ≤ n : P(X = k) = C(n, k) pᵏ (1−p)ⁿ⁻ᵏ. C(n, k) = n! / [k! (n−k)!].","Paramètres : Espérance E(X) = n·p, Variance V(X) = n·p·(1−p), Écart-type σ(X) = √(n·p·(1−p)).","Probabilités cumulées : P(X ≤ k) = P(X = 0) + … + P(X = k), P(X ≥ k) = 1 − P(X ≤ k−1), P(a ≤ X ≤ b) = Σ P(X = i) de i = a à b.","Exemple : On lance 5 fois une pièce équilibrée : X = nombre de piles, X ~ B(5 ; 0,5). P(X = 3) = C(5,3)·(0,5)³·(0,5)² = C(5,3)·(0,5)⁵ = 10/32 ≈ 0,3125. Espérance E(X) = 5 × 0,5 = 2,5."],"me":"Compte d’abord les succès, puis applique la formule avec le bon k, le bon n et le bon p.","d":"Le schéma de Bernoulli, les probabilités, les paramètres, les probabilités cumulées et un exemple complet."},{"id":"f5","m":"Maths","t":"Suites arithmétiques","min":15,"free":0,"f":"uₙ₊₁ = uₙ + r • uₙ = u₀ + n·r • Sₙ = (n+1)(u₀ + uₙ) / 2","p":["Définition : (uₙ) est arithmétique s’il existe un réel r tel que : uₙ₊₁ = uₙ + r. r est la raison. Pour n ≠ p : r = (uₙ − uₚ) / (n − p).","Terme explicite : Si premier terme u₀ : uₙ = u₀ + n·r. Plus généralement : uₙ = uₚ + (n − p)·r.","Monotonie : Si r > 0 : croissante. Si r = 0 : constante. Si r < 0 : décroissante.","Limites : Si r > 0 : lim uₙ = +∞. Si r < 0 : lim uₙ = −∞. Si r = 0 : lim uₙ = u₀ (n → +∞).","Sommes : Sₙ = u₀ + … + uₙ = (n+1)(u₀ + uₙ) / 2. Plus généralement de uₚ à uₘ : uₚ + … + uₘ = (m − p + 1)(uₚ + uₘ) / 2."],"me":"Trouve d’abord r avec uₙ₊₁ − uₙ, puis écris le terme général avant toute somme ou limite.","d":"Définition, terme explicite, monotonie, limites et sommes d’une suite arithmétique."},{"id":"f6","m":"Maths","t":"Trigonométrie — Addition / Duplication","min":16,"free":0,"f":"sin(a+b) = sin a cos b + cos a sin b • sin(2a) = 2 sin a cos a","p":["Identités : sin²x + cos²x = 1, tan x = sin x / cos x (cos x ≠ 0).","Addition : cos(a + b) = cos a cos b − sin a sin b, sin(a + b) = sin a cos b + cos a sin b.","Différence : cos(a − b) = cos a cos b + sin a sin b, sin(a − b) = sin a cos b − cos a sin b.","Duplication : sin(2a) = 2 sin a cos a, cos(2a) = cos²a − sin²a = 2cos²a − 1 = 1 − 2sin²a.","Tangente : tan(a + b) = (tan a + tan b) / (1 − tan a tan b), tan(a − b) = (tan a − tan b) / (1 + tan a tan b), tan(2a) = 2 tan a / (1 − tan²a)."],"me":"Apprends cos(a+b) et sin(a+b) par cœur : les formules de différence et de duplication en découlent.","d":"Identités, formules d’addition, de différence, de duplication et tangente."},{"id":"f7","m":"Maths","t":"Exponentielle et logarithme","min":17,"free":0,"f":"eᵃ × eᵇ = eᵃ⁺ᵇ • ln(ab) = ln a + ln b • (eˣ)′ = eˣ • (ln x)′ = 1/x","p":["Exponentielle : 1) eᵃ × eᵇ = e^(a+b)  2) eᵃ / eᵇ = e^(a−b)  3) e⁰ = 1  4) 1 / eᵃ = e^(−a)  5) (eᵃ)ᵐ = e^(am).","Exponentielle : 6) (eˣ)′ = eˣ  7) (eᵘ)′ = u′ eᵘ  8) lim eˣ = 0 (x → −∞)  9) lim eˣ = +∞ (x → +∞).","Logarithme : 1) ln(ab) = ln a + ln b  2) ln(a/b) = ln a − ln b  3) ln 1 = 0  4) ln(1/a) = −ln a  5) ln(aᵐ) = m ln a.","Logarithme : 6) (ln x)′ = 1/x  7) (ln u)′ = u′ / u  8) lim ln x = −∞ (x → 0⁺)  9) lim ln x = +∞ (x → +∞).","À retenir : eˣ et ln x sont réciproques ; en +∞, eˣ domine toute puissance, et toute puissance domine ln x."],"me":"Transforme d’abord les produits en sommes avec ln, et les sommes d’exposants en produits avec e.","d":"Les règles de calcul, les dérivées et les limites de l’exponentielle et du logarithme."},{"id":"f8","m":"Maths","t":"Dérivation","min":15,"free":0,"f":"(u v)′ = u′ v + u v′ • (u/v)′ = (u′v − u v′) / v² • (xⁿ)′ = n xⁿ⁻¹","p":["(u + v)′ = u′ + v′, (k u)′ = k u′.","(u v)′ = u′ v + u v′.","(u / v)′ = (u′v − u v′) / v² (v ≠ 0).","(v ∘ u)′(x) = u′(x)·v′(u(x)).","Dérivées usuelles : (k)′ = 0, (x)′ = 1, (xⁿ)′ = n xⁿ⁻¹, (eˣ)′ = eˣ, (ln x)′ = 1/x."],"me":"Identifie d’abord la forme : somme, produit, quotient ou composée — puis applique la bonne règle.","d":"Les règles de dérivation et les dérivées usuelles à connaître par cœur."},{"id":"f9","m":"Maths","t":"Suites géométriques","min":16,"free":0,"f":"uₙ₊₁ = q·uₙ • uₙ = u₀·qⁿ • Sₙ = u₀·(1 − qⁿ⁺¹) / (1 − q)","p":["Définition : (uₙ) est géométrique s’il existe un réel q tel que : uₙ₊₁ = q·uₙ. q est la raison. Si uₙ ≠ 0, q = uₙ₊₁ / uₙ.","Terme explicite : Si premier terme u₀ : uₙ = u₀·qⁿ. Plus généralement : uₙ = uₚ·q^(n−p).","Monotonie (cas usuels) : Si u₀ > 0 et q > 1 : croissante. Si u₀ > 0 et q = 1 : constante. Si u₀ > 0 et 0 < q < 1 : décroissante.","Limites : Si u₀ > 0 et q > 1 : lim uₙ = +∞. Si q = 1 : lim uₙ = u₀. Si |q| < 1 : lim uₙ = 0. Si q ≤ −1 : pas de limite en général.","Sommes : Pour q ≠ 1 : uₚ + … + uₘ = uₚ·(1 − q^(m−p+1)) / (1 − q). En particulier Sₙ = u₀ + … + uₙ = u₀·(1 − q^(n+1)) / (1 − q). Si q = 1 : Sₙ = (n+1)·u₀."],"me":"Trouve d’abord q avec uₙ₊₁ / uₙ, puis écris le terme général avant toute somme ou limite.","d":"Définition, terme explicite, monotonie, limites et sommes d’une suite géométrique."},{"id":"f10","m":"Physique-Chimie","t":"Acides aminés","min":20,"free":1,"f":"NH₂–CHR–COOH • Zwitterion ⁺H₃N–CHR–COO⁻ • Liaison peptidique –CO–NH–","p":["Formule générale : NH₂–CHR–COOH. R est la chaîne latérale qui change d’un acide aminé à l’autre.","Groupement amine –NH₂ : caractère basique. Groupement carboxyle –COOH : caractère acide.","Zwitterion : en solution, l’acide aminé porte les deux charges : ⁺H₃N–CHR–COO⁻.","Liaison peptidique : –CO–NH– formée entre le –COOH d’un acide aminé et le –NH₂ du suivant, avec élimination d’eau.","Protéines : enchaînement de nombreux acides aminés par des liaisons peptidiques.","Exemples : glycine (R = H) et alanine (R = CH₃)."],"me":"Repère d’abord les deux groupes : amine –NH₂ et carboxyle –COOH, puis écris la liaison peptidique entre deux acides aminés.","d":"Chimie : la formule générale, le zwitterion, la liaison peptidique et les protéines."},{"id":"f11","m":"Physique-Chimie","t":"Acides carboxyliques & Esters","min":22,"free":1,"f":"R–COOH • Estérification : Acide + Alcool ⇌ Ester + Eau • Saponification : Ester + Soude → Savon + Alcool","p":["Acide carboxylique : R–COOH. Exemple : l’acide éthanoïque CH₃–COOH.","Estérification : Acide + Alcool ⇌ Ester + Eau. Réaction lente, limitée, réversible.","Hydrolyse d’un ester : réaction inverse de l’estérification : Ester + Eau ⇌ Acide + Alcool.","Saponification : Ester + Soude → Savon + Alcool. Réaction totale et rapide.","À retenir : la saponification fabrique le savon ; l’estérification fabrique l’ester.","Repère : ⇌ pour une réaction limitée et réversible, → pour une réaction totale."],"me":"Estérification : lente, limitée, réversible. Hydrolyse : inverse. Saponification : totale, rapide — ne confonds pas les trois.","d":"Chimie : acides carboxyliques, estérification, hydrolyse et saponification."},{"id":"f12","m":"Physique-Chimie","t":"Solutions aqueuses & pH","min":20,"free":0,"f":"pH = −log[H₃O⁺] • [H₃O⁺] = 10^(−pH) • Henderson : pH = pKa + log([base]/[acide])","p":["pH = −log[H₃O⁺] et, dans l’autre sens, [H₃O⁺] = 10^(−pH).","pH neutre = 7. Solution acide : pH < 7. Solution basique : pH > 7.","Couple acide / base : AH / A⁻. L’acide donne un proton H⁺, la base le capte.","Constante d’acidité Ka et pKa = −log Ka : plus le pKa est petit, plus l’acide est fort.","Formule de Henderson : pH = pKa + log([base]/[acide]).","À retenir : si [base] = [acide], alors pH = pKa."],"me":"Calcule d’abord [H₃O⁺] ou le pH, puis place la solution : acide, neutre ou basique.","d":"Chimie : pH, couples acide/base, Ka, pKa et formule de Henderson."},{"id":"f13","m":"Physique-Chimie","t":"Cinétique chimique","min":19,"free":0,"f":"v = −d[réactif]/dt • Temps de demi-réaction t₁/₂ • Facteurs : temps, température, concentration, catalyseur","p":["Vitesse de réaction : elle décrit à quelle vitesse les réactifs disparaissent et les produits apparaissent.","Vitesse volumique : v = −d[réactif]/dt. Le signe − compense la diminution de la concentration.","Facteur temps : la vitesse diminue en général au cours du temps, car les réactifs s’épuisent.","Facteur température : une température plus élevée accélère la réaction.","Facteur concentration : une concentration initiale plus élevée accélère la réaction.","Catalyseur : il accélère la réaction sans être consommé. Temps de demi-réaction t₁/₂ : durée pour que la concentration d’un réactif soit divisée par deux."],"me":"Suis une concentration au cours du temps, puis lis la vitesse sur la pente de la courbe.","d":"Chimie : vitesse de réaction, facteurs cinétiques et temps de demi-réaction."},{"id":"f30","m":"Physique-Chimie","t":"Chimie organique","min":21,"free":0,"f":"Alcanes CₙH₂ₙ₊₂ • Alcènes CₙH₂ₙ • Alcools –OH • Aldéhydes –CHO • Cétones –CO–","p":["Alcanes : CₙH₂ₙ₊₂, liaisons simples uniquement. Exemple : méthane CH₄, éthane C₂H₆.","Alcènes : CₙH₂ₙ, une double liaison C=C. Exemple : éthène C₂H₄.","Alcools : groupe –OH. Exemple : éthanol CH₃–CH₂–OH.","Aldéhydes : groupe –CHO en bout de chaîne. Cétones : groupe –CO– à l’intérieur de la chaîne.","Nomenclature : repère la chaîne la plus longue, puis la fonction et sa position.","Isomérie : même formule brute, formules développées différentes — donc propriétés différentes."],"me":"Compte d’abord la chaîne la plus longue, puis nomme la fonction : -ane, -ène, -ol, -al, -one.","d":"Chimie : alcanes, alcènes, alcools, aldéhydes, cétones, nomenclature et isomérie."},{"id":"f31","m":"Physique-Chimie","t":"Mécanique","min":24,"free":0,"f":"v(t) = dx/dt • a(t) = dv/dt • ΣF = m·a • Ec = ½ m·v² • Ep = m·g·h • W = F·d·cos α","p":["Mouvement rectiligne : position x(t), vitesse v(t) = dx/dt, accélération a(t) = dv/dt.","2ᵉ loi de Newton : ΣF = m·a. La somme des forces donne l’accélération.","Chute libre (sans vitesse initiale) : v = g·t ; h = ½·g·t².","Projectile : trajectoire parabolique ; portée maximale à 45°.","Énergie cinétique Ec = ½·m·v² ; potentielle Ep = m·g·h ; mécanique Em = Ec + Ep.","Sans frottement, Em = constante. Travail d’une force : W = F·d·cos α."],"me":"Bilan des forces → 2ᵉ loi de Newton → équations horaires x(t), v(t), a(t), puis énergie.","d":"Physique : mouvement rectiligne, chute libre, projectile, travail et énergie mécanique."},{"id":"f32","m":"Physique-Chimie","t":"Électricité","min":22,"free":0,"f":"U = R·I • P = U·I • Condensateur q = C·U • RC : τ = R·C • RL : τ = L/R • Bobine u_L = L·di/dt","p":["Loi d’Ohm : U = R·I aux bornes d’un conducteur ohmique.","Puissance : P = U·I ; énergie : E = P·t.","Condensateur : q = C·U ; énergie stockée E = ½·C·U².","Circuit RC : charge et décharge exponentielles, constante de temps τ = R·C.","Circuit RL : constante de temps τ = L/R ; la bobine s’oppose aux variations du courant.","Bobine : tension u_L = L·di/dt. En régime permanent, la bobine se comporte comme un fil."],"me":"Repère le circuit, écris la loi des mailles ou des nœuds, puis la charge du condensateur ou le courant dans la bobine.","d":"Physique : loi d’Ohm, puissance, condensateur, circuits RC et RL."},{"id":"f33","m":"Physique-Chimie","t":"Optique","min":20,"free":0,"f":"1/OA′ − 1/OA = 1/f′ • Vergence C = 1/f′ • γ = A′B′/AB = OA′/OA","p":["Lentille convergente : relation de conjugaison 1/OA′ − 1/OA = 1/f′.","Vergence : C = 1/f′. Elle se mesure en dioptries (δ).","Grandissement : γ = A′B′/AB = OA′/OA. Il donne la taille et le sens de l’image.","Image réelle : elle se forme sur un écran, du côté opposé à l’objet.","Image virtuelle : elle ne se forme pas sur un écran ; on la voit en regardant à travers la lentille.","Foyer image F′ : les rayons parallèles à l’axe convergent en F′."],"me":"Trace les rayons caractéristiques, puis applique la relation de conjugaison avec les signes.","d":"Physique : lentille convergente, vergence, image réelle ou virtuelle et grandissement."},{"id":"f34","m":"Physique-Chimie","t":"Physique nucléaire","min":21,"free":0,"f":"N = N₀·e^(−λ·t) • Demi-vie T = ln2/λ • E = m·c²","p":["Radioactivité alpha : émission d’un noyau d’hélium ⁴₂He.","Radioactivité bêta− : émission d’un électron. Radioactivité bêta+ : émission d’un positon.","Rayonnement gamma : émission d’un photon très énergétique, sans changement du noyau.","Loi de décroissance : N = N₀·e^(−λ·t). N est le nombre de noyaux restants.","Demi-vie : T = ln2/λ. Après une demi-vie, il reste la moitié des noyaux.","Équivalence masse-énergie : E = m·c². Fission : un gros noyau se casse. Fusion : deux petits noyaux s’assemblent."],"me":"Écris d’abord le type de radioactivité, puis applique la loi de décroissance et la demi-vie.","d":"Physique : radioactivité alpha, bêta−, bêta+, gamma, décroissance, fission et fusion."},{"id":"f35","m":"Physique-Chimie","t":"Ondes","min":18,"free":0,"f":"f = 1/T • λ = v·T • Diffraction • Interférences","p":["Onde mécanique : propagation d’une perturbation sans transport de matière.","Période T : durée d’une oscillation. Fréquence f = 1/T, en hertz (Hz).","Longueur d’onde : λ = v·T. C’est la distance parcourue par l’onde pendant une période.","Diffraction : une onde s’étale en passant par une ouverture de taille proche de λ.","Interférences : deux ondes qui se superposent peuvent se renforcer ou s’annuler.","À retenir : la diffraction révèle la nature ondulatoire ; plus l’ouverture est petite, plus l’étalement est grand."],"me":"Repère d’abord T ou f, puis calcule λ = v·T avant de parler de diffraction ou d’interférences.","d":"Physique : ondes mécaniques, période, fréquence, longueur d’onde, diffraction et interférences."},{"id":"f14","m":"SVT","t":"Génétique","min":22,"free":1,"f":"ADN → ARN → protéine • Mitose / Méiose","p":["ADN : double hélice, bases A–T et C–G ; gène = portion d’ADN.","Transcription : ADN → ARN messager. Traduction : ARN → protéine.","Code génétique : 3 bases (codon) → 1 acide aminé.","Mitose : 1 cellule → 2 cellules identiques. Méiose : 1 cellule → 4 cellules haploïdes.","Lois de Mendel : ségrégation des allèles ; échiquier de Punnett pour prévoir les croisements."],"me":"Repère le type de division, puis suis l’information : ADN, transcription, traduction.","d":"De l’ADN à la protéine, mitose et méiose, lois de Mendel : comprendre comment l’information se transmet."},{"id":"f15","m":"SVT","t":"Immunologie","min":19,"free":1,"f":"Antigène → anticorps • Lymphocytes B et T","p":["Antigène : élément reconnu comme étranger. Anticorps : protéine qui le neutralise.","Lymphocytes B : immunité humorale, production d’anticorps.","Lymphocytes T : immunité cellulaire, destruction des cellules infectées.","Vaccination : mémoire immunitaire, réponse plus rapide et plus forte.","VIH : attaque les lymphocytes T CD4 ; séropositivité = présence d’anticorps anti-VIH."],"me":"Identifie l’antigène, puis la réponse : humorale (B) ou cellulaire (T).","d":"Antigènes, anticorps, lymphocytes B et T, vaccination et VIH : comment le corps se défend."},{"id":"f16","m":"SVT","t":"Géologie","min":17,"free":0,"f":"Tectonique des plaques • Séisme / Volcanisme","p":["Lithosphère découpée en plaques rigides en mouvement sur l’asthénosphère.","Divergence : dorsales, création de croûte. Convergence : subduction, collision, montagnes.","Séisme : rupture brutale, ondes sismiques, foyer et épicentre.","Volcanisme : remontée de magma ; lave, cendres, gaz.","Roches sédimentaires au Togo : dépôt, compaction, fossiles — archives des milieux anciens."],"me":"Relie chaque phénomène à un mouvement de plaque : divergence, convergence, coulissage.","d":"Tectonique des plaques, séismes, volcanisme et roches sédimentaires, avec des repères au Togo."},{"id":"f17","m":"SVT","t":"Reproduction","min":18,"free":0,"f":"Cycle ovarien • Fécondation • Régulation hormonale","p":["Cycle ovarien : phase folliculaire, ovulation (≈ 14ᵉ jour), phase lutéale.","Œstrogènes : développement des follicules et de l’endomètre.","Progestérone : prépare l’utérus à la nidation.","FSH et LH (hypophyse) : commandent l’ovaire ; pic de LH → ovulation.","Fécondation : fusion spermatozoïde + ovule → zygote, puis nidation."],"me":"Place chaque hormone sur le cycle, puis explique son effet sur l’ovaire et l’utérus.","d":"Hormones, cycle ovarien, fécondation et régulation : un système en boucle, contrôlé par le cerveau."},{"id":"f18","m":"SVT","t":"Écologie","min":16,"free":0,"f":"Photosynthèse : 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂","p":["Écosystème : milieu + êtres vivants en interaction (biotope + biocénose).","Chaîne alimentaire : producteur → consommateur primaire → secondaire → décomposeur.","Photosynthèse : 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, grâce à la lumière et la chlorophylle.","Respiration : inverse de la photosynthèse, libère l’énergie.","Équilibre : toute rupture (pollution, déforestation) se propage dans la chaîne."],"me":"Dessine la chaîne alimentaire, puis suis la matière et l’énergie de maillon en maillon.","d":"Écosystème, chaîne alimentaire et photosynthèse : les producteurs fabriquent la matière qui nourrit tout le reste."},{"id":"f19","m":"Français","t":"Dissertation","min":25,"free":1,"f":"Intro → Développement → Conclusion","p":["Introduction : amener le sujet → reformuler → problématique → plan annoncé.","Développement : thèse, antithèse, synthèse — chaque partie en paragraphes distincts.","Chaque paragraphe : idée + exemple précis + analyse de l’exemple.","Conclusion : bilan de la réponse, sans idée nouvelle, puis ouverture.","Relis : orthographe, connecteurs (d’abord, cependant, ainsi) et longueur équilibrée."],"me":"Une idée = un paragraphe : affirmation, exemple, analyse. Annonce le plan dès l’introduction.","d":"Introduction : amener le sujet, poser la problématique, annoncer le plan. Développement : thèse / antithèse / synthèse. Conclusion : réponse + ouverture."},{"id":"f20","m":"Français","t":"Commentaire composé","min":22,"free":1,"f":"Axes de lecture • Figures de style","p":["Axes de lecture : par exemple, un portrait, une dénonciation, une émotion.","Métaphore : comparaison sans outil (« un océan de tristesse »).","Anaphore : répétition en début de phrase ou de vers pour insister.","Hyperbole : exagération pour frapper (« mille fois »).","Ne jamais citer sans analyser : chaque citation doit servir l’axe."],"me":"Choisis 2 ou 3 axes, puis pour chaque axe : procédé → citation courte → effet.","d":"Le commentaire suit le texte : on repère les procédés, on les analyse, on montre ce qu’ils font comprendre ou ressentir."},{"id":"f21","m":"Français","t":"Contraction de texte","min":20,"free":0,"f":"Contraction ≈ 1/4 du texte • Reformulation","p":["Longueur : environ 1/4 du texte d’origine — compte les mots.","Reformulation : change les mots et les tournures, sans recopier de phrases.","Fidélité : mêmes idées, même ordre, même point de vue que l’auteur.","Aucun exemple inventé, aucun avis personnel, aucun « je » de l’auteur repris tel quel.","Vérifie à la fin : chaque idée essentielle est-elle conservée ?"],"me":"Repère les idées essentielles, reformule-les dans tes mots, sans copier ni ajouter d’avis.","d":"La contraction réduit le texte à environ un quart de sa longueur, en gardant l’ordre, les idées et le ton de l’auteur."},{"id":"f22","m":"Français","t":"Œuvres au programme — Togo","min":26,"free":0,"f":"Auteur • Thèmes • Personnages • Citations","p":["L’aventure ambiguë — Cheikh Hamidou Kane : Samba Diallo entre tradition et école occidentale.","Une si longue lettre — Mariama Bâ : Ramatoulaye, amitié, polygamie, condition des femmes.","Le Mandat — Sembène Ousmane : Ibrahima Dieng, le mandat perdu, la critique de l’administration.","Pour chaque œuvre : contexte, personnages, thèmes, passages clés.","En dissertation, un exemple précis vaut mieux qu’un résumé vague."],"me":"Pour chaque œuvre : auteur, résumé en 5 lignes, 3 thèmes, 1 citation à analyser.","d":"Trois œuvres à connaître en profondeur : l’identité et le voyage, la condition des femmes, le pouvoir et la justice."},{"id":"f23","m":"Anglais","t":"Essay & Comprehension","min":16,"free":1,"f":"Topic sentence • Evidence • Link","p":["Read the questions first, then scan the text for the answers.","Answer in your own words — do not copy whole sentences.","Essay : introduction, 2–3 body paragraphs, conclusion.","Each paragraph : topic sentence → evidence / example → link to the question.","Linkers : however, moreover, therefore, for instance."],"me":"Answer in your own words. Quote only when asked, and always explain the quote.","d":"Reading comprehension and essay writing: understand the text, answer precisely, then build a clear essay."},{"id":"f24","m":"Philo","t":"La conscience & la liberté","min":20,"free":1,"f":"Problématiser • Thèse • Antithèse • Synthèse","p":["Conscience : connaissance de soi, du monde et de ses actes.","Liberté : pouvoir de choisir ; elle suppose la responsabilité.","Thèse / antithèse : présente une position, puis la position opposée.","Synthèse : dépasse l’opposition par une réponse nuancée.","Définis les notions dans l’introduction : c’est la moitié du sujet."],"me":"Définis chaque notion avant de la discuter, puis confronte deux positions.","d":"Conscience : se connaître et juger ses actes. Liberté : agir sans contrainte — mais jusqu’où ?"}];

const ANN=[{"id":"m-d-2025","y":2025,"s":"Maths","t":"BAC II 2025 — Mathématiques, série D (4 h, coef. 3)","su":[{"h":"Exercice I (8 points)","x":"Le conseil municipal d'une commune du Togo lance un concours d'architecture pour un parc d'attraction. Chakira, architecte, imagine un parc circulaire traversé par une voie rectiligne, deux lampadaires géants et des voies secondaires.\nDans le plan complexe (O, u, v), pour z = x + iy différent de −2 − 3i, on note f(z) = (z − 4 − 3i)/(z + 2 + 3i).\n• (C), pourtour du parc : ensemble des points M d'affixe z tels que f(z) soit imaginaire pur.\n• (Δ), voie rectiligne : ensemble des points M d'affixe z tels que f(z) soit réel.\n• Les lampadaires sont les points A et B d'affixes z_A = f(−2 − i) et z_B tel que f(z_B) = −i.\n• Une voie secondaire a l'allure de la courbe (Γ) de la fonction g définie par g(x) = (x + 1) ln(x² + 2x + 1) si x ≠ −1 et g(−1) = 0.\nConsigne 1 : construis (Δ), (C) et les points A et B.\nConsigne 2 : trace (Γ)."},{"h":"Exercice II (6 points)","x":"I. Choisis la bonne réponse (0,75 pt × 6)\n1. Une primitive sur ℝ de x ↦ cos x − x sin x est : A) cos x − sin x ; B) x cos x ; C) cos x + sin x ; D) −x cos x.\n2. La distance du point A(3 ; 2 ; 1) au plan (P) : 2x − y + 3z + 5 = 0 est : A) √6 ; B) √14 ; C) 6√14/7 ; D) 6√7/7.\n3. lim (x + 4)e^(−x) quand x → −∞ vaut : A) −∞ ; B) +∞ ; C) 0 ; D) 4.\n4. s est la similitude directe de centre P(1 + i), de rapport 2 et d'angle π/3. Son écriture complexe est : A) z′ = (1 + i√3)z + √3 − i√3 ; B) z′ = (√3 + i)z + √3 − i√3 ; C) z′ = (1 + i√3)z − √3 + i√3 ; D) z′ = (1 − i√3)z + √3 − i√3.\n5. f(x) = (2√x − 2)/(x − 1) si x ∈ [0 ; 1[ et f(x) = ax² + x + a − 6 si x ∈ [1 ; +∞[. f est continue en 1 si et seulement si : A) a = −2 ; B) a = 0 ; C) a = 3 ; D) a = 1.\n6. (u_n) est géométrique de premier terme u₀ = 1 et de raison e. Le produit P_n = u₀ × u₁ × … × u_n est égal à : A) e^(n(n+1)/2) ; B) e^(n(n+1)) ; C) e^(n(n−1)/2) ; D) e^(n(n−1)).\nII. Complète sans recopier le texte (0,25 pt × 6)\nUne primitive de f sur un intervalle ouvert K est la fonction F …a… sur K telle que, pour tout x de K, F′(x) = …b…. Une similitude plane directe multiplie les …c… par un réel k > 0, appelé …d… de la similitude. Avec z′ = az + b : si a = 1, s est une …e… ; si a est réel, non nul et différent de 1, s est une …f…."},{"h":"Exercice III (6 points)","x":"A. Une urne contient 4 boules blanches, 2 boules noires et 5 boules rouges. On tire simultanément 3 boules.\n1. Quel est le nombre total de tirages possibles ?\n2. Quelle est la probabilité d'obtenir une boule de chaque couleur ?\n3. X est le nombre de boules noires tirées. a) Détermine les valeurs prises par X. b) Détermine la loi de probabilité de X. c) Calcule l'espérance et l'écart-type de X.\nB. (E₀) : y′ = y. 1. Résous (E₀).\n2. (E) : y′ = y − cos x − 3 sin x, et h(x) = 2cos x + sin x. a) Démontre que h est solution de (E). b) Démontre que f est solution de (E) si et seulement si f − h est solution de (E₀), puis déduis-en toutes les solutions de (E). c) Détermine l'unique solution g de (E) telle que g(0) = 0.\n3. Calcule ∫ de 0 à π/2 de (−2eˣ + sin x + 2cos x) dx."}],"co":[{"h":"Exercice I • Consigne 1 — (Δ), (C), A et B","x":"On écrit f(z) sous forme algébrique en multipliant par le conjugué du dénominateur :\nf(z) = [(x² + y² − 2x − 17) + i(−6x + 6y + 6)] / [(x + 2)² + (y + 3)²].\n• f(z) réel ⟺ −6x + 6y + 6 = 0 ⟺ x − y − 1 = 0 : (Δ) est la droite d'équation x − y − 1 = 0, privée du point (−2 ; −3).\n• f(z) imaginaire pur ⟺ x² + y² − 2x − 17 = 0 ⟺ (x − 1)² + y² = 18 : (C) est le cercle de centre Ω(1 ; 0) et de rayon 3√2, privé du point (−2 ; −3).\n• z_A = f(−2 − i) = (−6 − 4i)/(2i) = −2 + 3i, donc A(−2 ; 3).\n• f(z_B) = −i ⟺ z_B(1 + i) = 7 + i ⟺ z_B = 4 − 3i, donc B(4 ; −3).\nPour construire : trace la droite et le cercle (le point (−2 ; −3) en est exclu), puis place A et B.","m":"Pour qu'un quotient de complexes soit réel ou imaginaire pur, passe par la forme algébrique : partie imaginaire nulle pour « réel », partie réelle nulle pour « imaginaire pur »."},{"h":"Exercice I • Consigne 2 — Tracé de (Γ)","x":"g(x) = 2(x + 1) ln|x + 1| pour x ≠ −1, et g(−1) = 0 ; g est définie sur ℝ.\n• Limites : g tend vers −∞ en −∞ et vers +∞ en +∞. Comme g(x)/x → +∞ aux deux infinis, (Γ) a des branches paraboliques de direction l'axe des ordonnées.\n• Continuité en −1 : g(x) → 0 des deux côtés (car X ln|X| → 0 quand X → 0), donc g est continue en −1.\n• Dérivabilité en −1 : (g(x) − g(−1))/(x + 1) = ln((x + 1)²) → −∞, donc g n'est pas dérivable en −1 (tangente verticale).\n• Dérivée : g′(x) = ln((x + 1)²) + 2, qui s'annule pour x = −1 − e⁻¹ et x = −1 + e⁻¹.\n• Variations : g croît sur ]−∞ ; −1 − e⁻¹], décroît sur [−1 − e⁻¹ ; −1 + e⁻¹], puis croît sur [−1 + e⁻¹ ; +∞[. Maximum local 2e⁻¹ en −1 − e⁻¹ ; minimum local −2e⁻¹ en −1 + e⁻¹.\nTrace (Γ) à partir de ce tableau, en passant par O(0 ; 0).","m":"Étude d'une fonction : domaine, limites, branches infinies, continuité et dérivabilité aux points sensibles, dérivée, tableau de variation, puis courbe."},{"h":"Exercice II • I — QCM","x":"1) B : (x cos x)′ = cos x − x sin x.\n2) C : d = |2×3 − 2 + 3×1 + 5| / √(4 + 1 + 9) = 12/√14 = 6√14/7.\n3) A : quand x → −∞, x + 4 → −∞ et e^(−x) → +∞, donc la limite est −∞.\n4) A : z′ − (1 + i) = (1 + i√3)(z − (1 + i)), car 2e^(iπ/3) = 1 + i√3 ; en développant, z′ = (1 + i√3)z + √3 − i√3.\n5) C : à gauche de 1, f(x) = 2/(√x + 1) → 1 ; à droite, f(1) = 2a − 5. La continuité exige 2a − 5 = 1, donc a = 3.\n6) A : P_n = e^(0 + 1 + … + n) = e^(n(n+1)/2).","m":"Pour un QCM, vérifie chaque proposition par un calcul rapide (dérivation, valeur numérique) au lieu de deviner."},{"h":"Exercice II • II — Compléter","x":"a) dérivable ; b) f(x) ; c) distances (longueurs) ; d) rapport ; e) translation ; f) homothétie.","m":"Apprends les définitions du cours mot pour mot : elles sont demandées telles quelles."},{"h":"Exercice III • A — Probabilités","x":"1) Nombre de tirages : C(11, 3) = 165.\n2) Une boule de chaque couleur : 4 × 2 × 5 / 165 = 40/165 = 8/33 ≈ 0,242.\n3) a) X(Ω) = {0 ; 1 ; 2}.\n b) P(X = 0) = C(9,3)/165 = 84/165 = 28/55 ; P(X = 1) = 2 × C(9,2)/165 = 72/165 = 24/55 ; P(X = 2) = C(9,1)/165 = 9/165 = 3/55.\n c) E(X) = 0 × 28/55 + 1 × 24/55 + 2 × 3/55 = 30/55 = 6/11. V(X) = E(X²) − E(X)² = 36/55 − 36/121 = 216/605, donc σ(X) = √(216/605) = 6√30/55 ≈ 0,598.","m":"Tirage simultané → combinaisons. Vérifie que la somme des probabilités de la loi vaut 1 (28 + 24 + 3 = 55)."},{"h":"Exercice III • B — Équations différentielles","x":"1) (E₀) : y′ = y a pour solutions x ↦ k eˣ, k ∈ ℝ.\n2) a) h′(x) = −2 sin x + cos x et h(x) − cos x − 3 sin x = (2cos x + sin x) − cos x − 3 sin x = cos x − 2 sin x. Donc h′ = h − cos x − 3 sin x : h est solution de (E).\n b) f est solution de (E) ⟺ f′ = f − cos x − 3 sin x. Or h′ = h − cos x − 3 sin x, donc (f − h)′ = f′ − h′ = f − h, c'est-à-dire f − h est solution de (E₀). Les solutions de (E) sont donc x ↦ 2cos x + sin x + k eˣ, k ∈ ℝ.\n c) g(0) = 0 ⟺ 2 + k = 0 ⟺ k = −2, donc g(x) = 2cos x + sin x − 2eˣ.\n3) ∫₀^(π/2) (−2eˣ + sin x + 2cos x) dx = [−2eˣ − cos x + 2 sin x] de 0 à π/2 = (−2e^(π/2) + 2) − (−3) = 5 − 2e^(π/2).","m":"Équation avec second membre : solution particulière + solutions de l'équation sans second membre."}]}];
