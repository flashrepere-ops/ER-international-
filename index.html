<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1535">
<title>BAC Réussite International</title>
<style>
:root{--bg:#0B1535;--card:#142048;--deep:#0A1129;--gold:#E8B612;--ink:#fff;--mute:#9FB0D8;--ok:#2FD39A;--bad:#F87171}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:84px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 8px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.5px}h2{font-size:22px;margin:4px 0 12px}h3{font-size:17px}
p{color:var(--mute);line-height:1.5}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0}
.gold{background:linear-gradient(135deg,#6b4a00,#d9a30c);border-radius:26px;padding:20px;margin:14px 0}
.gold p{color:#fff3cf}
.btn{width:100%;padding:15px;border-radius:18px;background:var(--gold);color:#0B1535;font-weight:800;font-size:16px;margin-top:10px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--deep);color:#fff}.btn.ghost{background:none;color:var(--mute)}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--deep);font-size:13px;font-weight:700}
.pill.g{background:#12402f;color:var(--ok)}
input,select{width:100%;padding:14px;border-radius:16px;background:var(--deep);border:1px solid #243468;margin:6px 0}
.bar{height:10px;border-radius:9px;background:var(--deep);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .6s}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--deep);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:var(--mute);font-size:12px;padding:6px 14px;border-radius:14px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--gold);background:var(--card)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;color:var(--gold);line-height:1}
.opt{display:block;width:100%;text-align:left;padding:16px;border-radius:18px;background:var(--card);margin:9px 0;font-weight:700;transition:background .25s,transform .15s}
.opt:active{transform:scale(.98)}.opt.ok{background:var(--ok);color:#06281c}.opt.bad{background:var(--bad);color:#3a0c0c}
.lock{filter:blur(4px);user-select:none}
@keyframes ld{to{width:100%}}@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 2.6s linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#0B1535;padding:12px 18px;border-radius:16px;font-weight:700;z-index:40;max-width:90%;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ring{width:96px;height:96px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--gold) calc(var(--p)*1%),#243468 0);display:grid;place-items:center}.ring b{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--card);border-radius:18px;padding:14px 10px;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sp{position:fixed;inset:0;background:radial-gradient(circle at 25% 15%,#1d2f6b,#0B1535 62%);display:flex;flex-direction:column;justify-content:space-between;padding:calc(26px + env(safe-area-inset-top)) 22px 26px;z-index:20;text-align:center;transition:opacity .4s;cursor:pointer;overflow:auto}
.sp-top{display:flex;justify-content:space-between;color:#F7D56B;letter-spacing:2px;font-weight:800;font-size:15px}
.sp-c{position:relative;width:210px;height:210px;border-radius:50%;background:#F5C518;margin:10px auto 0;display:grid;place-items:center;box-shadow:0 0 70px #f5c51840;animation:pop 1s ease both}
.sp-c .globe{font-size:120px;line-height:1}
.sp-b{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#111;padding:8px 16px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap}
.sp-x{font-size:64px;font-weight:900;margin-top:20px;letter-spacing:-1px}.sp-s{color:#F7D56B;letter-spacing:4px;font-weight:800;font-size:15px}
.sp-p{color:#cfd8f0;font-size:18px;margin:14px 0}
.sp-k{display:flex;align-items:center;gap:12px;background:#0e1a3d;border:1px solid #1d2b5e;border-radius:26px;padding:16px;text-align:left}
.sp-k p{margin:2px 0 0}.sp-bar i{width:0;background:#E8B612}
.sp-c::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:conic-gradient(transparent 0,#F5C518 30%,transparent 55%,#F5C518 80%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));animation:spin 1.8s linear infinite}
.sp-c::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulse 1.4s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{box-shadow:0 0 0 0 #f5c51877}100%{box-shadow:0 0 0 38px #f5c51800}}
.sp-bar i{transition:none}
</style></head><body>
<div id="splash" class="sp" onclick="endSplash()"><div class="sp-top"><span>WEST AFRICA</span><span>2026 • EXAM</span></div>
<div><div class="sp-c"><span class="sp-b">🎓 100% RÉUSSITE</span><span class="globe">🌍</span></div><div class="sp-x">EXAM</div><div class="sp-s">BAC RÉUSSITE INTERNATIONAL</div><p class="sp-p">Révise, progresse et réussis ton examen — où que tu sois en Afrique de l’Ouest.</p></div>
<div><div class="sp-k"><span style="font-size:46px">🎉</span><div style="flex:1"><b style="font-size:19px">👩🏽‍🎓 👨🏽‍🎓 Ils célèbrent déjà...</b><p>Rejoins les élèves motivés.</p></div><span style="font-size:42px">⭐</span></div>
<div class="top" style="margin-top:22px"><b>Chargement de ta réussite...</b><b id="pc" style="color:#E8B612">0%</b></div><div class="bar sp-bar"><i id="pb"></i></div><p style="margin-top:14px">Ouverture de ton espace…</p></div></div>
<div id="app"></div><nav id="nav" hidden></nav><div id="toast" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyDYtHX2ws1otpfCa34F6dan1ncl1Q5SZg0",authDomain:"br-international-77015.firebaseapp.com",projectId:"br-international-77015",storageBucket:"br-international-77015.firebasestorage.app",messagingSenderId:"998944584250",appId:"1:998944584250:web:e5c747788e7cee0025fb03"});
const auth=getAuth(fb),db=getFirestore(fb);

/* ===== RÉGLAGES FACILES À MODIFIER ===== */
const PRIX="550 F CFA", JOURS=30;
const DATE_EXAMEN=null; // ex: "2027-06-15" quand la date officielle est connue
const FICHES=[
{id:"m1",m:"Maths",t:"Limites de fonction",min:15,free:1,f:"lim 1/x = 0 • lim eˣ = +∞ • lim ln x / xⁿ = 0",p:["Limites usuelles : lim 1/x = 0 (x → +∞), lim xⁿ = +∞ (n > 0).","Exponentielle / logarithme : lim eˣ = +∞ (x → +∞), lim eˣ = 0 (x → −∞), lim ln x = +∞ (x → +∞), lim ln x = −∞ (x → 0⁺).","Croissances comparées : lim ln x / xⁿ = 0 et lim xⁿ / eˣ = 0 en +∞."],me:"Repère d'abord qui domine en +∞ : eˣ domine toute puissance, et toute puissance domine ln x."},
{id:"m2",m:"Maths",t:"Probabilités",min:16,free:1,f:"P(A|B) = P(A∩B) / P(B) • P(X=k) = C(n,k) pᵏ (1−p)ⁿ⁻ᵏ",p:["Probabilité conditionnelle : P(A|B) = P(A∩B) / P(B), avec P(B) ≠ 0.","Loi binomiale B(n,p) : n épreuves indépendantes, succès avec la probabilité p.","Espérance E(X) = np ; variance V(X) = np(1−p)."],me:"Identifie d'abord la loi : répétition d'épreuves identiques et indépendantes → binomiale."},
{id:"m3",m:"Maths",t:"Trigonométrie — Identités + Dérivées"},{id:"m4",m:"Maths",t:"Loi binomiale"},{id:"m5",m:"Maths",t:"Suites arithmétiques"},{id:"m6",m:"Maths",t:"Exponentielle et logarithme"},{id:"m7",m:"Maths",t:"Dérivation"},
{id:"c1",m:"Physique-Chimie",t:"Acides aminés",min:20,free:1},{id:"c2",m:"Physique-Chimie",t:"Acides carboxyliques & Esters",min:22,free:1},{id:"c3",m:"Physique-Chimie",t:"Solutions aqueuses & pH"},{id:"c4",m:"Physique-Chimie",t:"Cinétique chimique"}];
const QS=[
{q:"lim eˣ quand x → −∞ vaut :",o:["0","−∞","1","+∞"],e:"Fiche Limites : lim eˣ = 0 quand x → −∞."},
{q:"La dérivée de f(x) = x³ est :",o:["3x²","x²","3x","x³/3"],e:"On applique (xⁿ)' = n·xⁿ⁻¹, donc (x³)' = 3x²."},
{q:"lim (ln x)/x quand x → +∞ vaut :",o:["0","+∞","1","−∞"],e:"Croissances comparées : x domine ln x en +∞."},
{q:"Pour X ~ B(10 ; 0,5), l'espérance E(X) vaut :",o:["5","10","0,5","2,5"],e:"E(X) = n × p = 10 × 0,5 = 5."},
{q:"P(A|B) est égal à :",o:["P(A∩B) / P(B)","P(A∩B) / P(A)","P(A) × P(B)","P(A) + P(B)"],e:"Définition : P(A|B) = P(A∩B) / P(B)."}];

const $=s=>document.querySelector(s);
let U=null,P=null,tab="home",mode="signup",pend={},Q=null,openF=null,tm=null;
const t0=performance.now(),spf=t=>{const p=Math.min(1,(t-t0)/2000);$("#pc").textContent=Math.round(p*100)+"%";$("#pb").style.width=p*100+"%";if(p<1)requestAnimationFrame(spf);else{const g=()=>window.rd0?endSplash():setTimeout(g,80);setTimeout(g,250)}};requestAnimationFrame(spf);setTimeout(()=>endSplash(),4500);
window.endSplash=()=>{const s=$("#splash");if(!s)return;s.style.opacity=0;setTimeout(()=>s.remove(),400)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,3200)};
const prem=()=>P&&P.premiumUntil&&P.premiumUntil.toMillis&&P.premiumUntil.toMillis()>Date.now();
const done=()=>P?.done||[];
const boom=()=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let i=0;i<36;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","✨","⭐","🎓"][i%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.append(s);setTimeout(()=>s.remove(),3600)}};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

/* ===== Connexion ===== */
const errFr=e=>({"auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/email-already-in-use":"Cet e-mail a déjà un compte. Connecte-toi.","auth/weak-password":"Mot de passe trop court (6 caractères minimum).","auth/invalid-email":"Adresse e-mail invalide.","auth/popup-closed-by-user":"Connexion Google annulée.","auth/unauthorized-domain":"Ce site n'est pas encore autorisé dans Firebase."}[e.code]||"Connexion impossible. Vérifie ta connexion internet.");
window.go=async()=>{const em=$("#em").value.trim(),pw=$("#pw").value;if(!em||!pw)return toast("Remplis l'e-mail et le mot de passe.");
 try{if(mode==="signup"){pend={name:$("#nm").value.trim()||"Élève",phone:$("#ph").value.trim(),op:$("#op").value};await createUserWithEmailAndPassword(auth,em,pw)}else await signInWithEmailAndPassword(auth,em,pw)}catch(e){toast(errFr(e))}};
window.goog=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){toast(errFr(e))}};
window.sw=()=>{mode=mode==="signup"?"login":"signup";view()};
window.out=()=>{signOut(auth)};
onAuthStateChanged(auth,async u=>{U=u;P=null;if(u){const r=doc(db,"users",u.uid);try{let s=await getDoc(r);if(!s.exists()){await setDoc(r,{name:pend.name||u.displayName||"Élève",phone:pend.phone||"",operator:pend.op||"",premium:false,done:[],best:0,createdAt:serverTimestamp()});s=await getDoc(r)}P=s.data();await tick()}catch(e){toast("Base de données inaccessible. Vérifie les règles Firestore.");P={name:u.displayName||"Élève",done:[],best:0}}}tab="home";view()});
const tick=async()=>{const t=new Date().toISOString().slice(0,10),y=new Date(Date.now()-864e5).toISOString().slice(0,10);window.gap=P.last?Math.round((new Date(t)-new Date(P.last))/864e5):0;if(P.last!==t)await save({streak:P.last===y?(P.streak||0)+1:1,last:t})};
const save=async d=>{Object.assign(P,d);try{await updateDoc(doc(db,"users",U.uid),d)}catch(e){toast("Progression non enregistrée.")}};

/* ===== Écrans ===== */
function view(){window.rd0=1;clearInterval(tm);const A=$("#app"),N=$("#nav");if(!U){N.hidden=true;A.innerHTML=`<div class="wrap"><p class="logo">EXAM • BAC RÉUSSITE</p><h1 style="margin:14px 0 4px">Bienvenue dans ton espace</h1><p>Retrouve ta progression partout.</p>
 <button class="btn alt" onclick="goog()">Continuer avec Google</button><p style="text-align:center;margin:14px 0 4px">ou avec tes coordonnées</p>
 ${mode==="signup"?`<input id="nm" placeholder="Ton prénom" autocomplete="given-name"><div style="display:flex;gap:8px"><select id="op" style="flex:1"><option>Yas Money</option><option>Moov Money Togo</option></select><input id="ph" style="flex:1" inputmode="tel" placeholder="90 00 00 00"></div>`:""}
 <input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password">
 <button class="btn" onclick="go()">${mode==="signup"?"Créer mon compte":"Me connecter"}</button><button class="btn ghost" onclick="sw()">${mode==="signup"?"J'ai déjà un compte":"Je n'ai pas encore de compte"}</button></div>`;return}
 N.hidden=false;N.innerHTML=[["home","🏠","Accueil"],["cours","📖","Cours"],["quiz","⏱️","Quiz"],["prem","👑","Premium"]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="tb('${k}')"><b>${i}</b>${l}</button>`).join("");
 const f={home:home,cours:cours,quiz:quiz,prem:premV,dip:dip}[tab];A.innerHTML=`<div class="wrap">${head()}${f()}</div>`}
const head=()=>`<div class="top"><span class="logo">BAC RÉUSSITE<br><small style="font-weight:400;letter-spacing:2px">INTERNATIONAL</small></span><span style="display:flex;gap:6px"><span class="pill ${prem()?"g":""}">${prem()?"PREMIUM 👑":"GRATUIT"}</span><span class="pill">🇹🇬 XOF</span><span class="pill">FR</span></span></div><p class="pill g" style="margin:12px 0 0;display:block;text-align:center">🇹🇬 TOGO - BAC D - ${prem()?"Premium":"Version gratuite 🔒"}</p>`;
window.tb=k=>{tab=k;openF=null;Q=null;view();scrollTo(0,0)};
const SUBJ=[["Maths","Σ"],["Physique-Chimie","⚡"],["SVT","🧬"],["Hist-Géo","🌍"],["ECM","⚖️"],["Français","✍️"]];
const pct=m=>{const fs=FICHES.filter(x=>x.m===m&&x.p);if(!fs.length)return 0;const d=fs.filter(x=>done().includes(x.id)).length;return Math.min(100,Math.round(d/fs.length*70+(m==="Maths"?(P?.best||0)/5*30:0)))};
const col=p=>p>=75?"var(--ok)":p>=45?"var(--gold)":"var(--bad)";
const ring=(p,l)=>`<div style="text-align:center"><div class="ring" style="--p:${p}"><b>${p}%</b></div><p style="margin-top:6px;color:#fff"><b>${l}</b></p></div>`;
window.gof=id=>{tab="cours";rd(id)};
function home(){const d=new Date(),dt=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}),left=DATE_EXAMEN?Math.ceil((new Date(DATE_EXAMEN)-d)/864e5):null,
 ps=SUBJ.map(([m,i])=>({m,i,p:pct(m)})),weak=ps.slice(0,2).sort((a,b)=>a.p-b.p)[0],next=FICHES.find(x=>x.p&&!done().includes(x.id)),all=Math.round(ps.reduce((a,s)=>a+s.p,0)/ps.length),st=P?.streak||1;
 return `<p style="margin-top:16px">${dt}</p><h1>Bonjour, ${esc(P?.name||"")} 👋</h1>
 <div class="gold"><p>Compte à rebours • BAC D</p><h1 style="font-size:46px;margin:6px 0">${left===null?"Bientôt":"J-"+Math.max(left,0)}</h1><p>${left===null?"La date officielle sera affichée ici.":"Avant l'examen. Courage !"}</p><div class="bar"><i style="width:${left===null?0:Math.min(100,Math.round(left/1.8))}%"></i></div><div class="row"><p>${left===null?"Date à confirmer":"Temps restant"}</p><p>🔥 Série de ${st} jour${st>1?"s":""}</p></div></div>
 <div class="card"><h3>📅 Date officielle</h3><p>Togo • Calendrier officiel</p><div style="background:var(--deep);border-radius:16px;padding:14px;margin-top:10px"><b>BAC D</b><p>${DATE_EXAMEN?new Date(DATE_EXAMEN).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"À confirmer"}</p></div></div>
 <div class="card"><div class="row"><h3>🧠 Mon Coach Intelligent</h3><span class="pill">${prem()?"👑":"🔒"} PREMIUM</span></div><p>Aperçu gratuit : 1er point faible.</p><div style="background:#3a2850;border-radius:18px;padding:14px;margin-top:10px"><p style="color:#f9a8a8;font-weight:800">Point faible</p><h3>${weak.m} — ${weak.p}%</h3><button class="btn" style="background:var(--bad);color:#fff;width:auto;padding:10px 18px" onclick="tb('cours')">Travailler ce point →</button></div>${prem()?"":`<div style="background:#1a2a5c;border-radius:18px;padding:16px;margin-top:10px;text-align:center"><div style="font-size:30px">🔒</div><b>Plan complet réservé Premium</b><button class="btn alt" onclick="tb('prem')">Débloquer avec Premium - ${PRIX}</button></div>`}</div>
 <div class="card"><h3>Plan du jour</h3><div class="row" style="margin-top:10px"><span class="pill">20 min</span><p style="color:#fff;flex:1">${next?"1) Lire la fiche — "+next.t:"1) Refaire un quiz pour t'entraîner"}</p><button class="pill" onclick="${next?`gof('${next.id}')`:"tb('quiz')"}">Go →</button></div><div class="row" style="margin-top:12px;background:var(--deep);border-radius:16px;padding:12px"><span>🔒</span><p style="flex:1">Examen blanc complet</p>${prem()?"":`<button class="pill" onclick="tb('prem')">Débloquer</button>`}</div></div>
 <div class="card"><h3>Mes progrès</h3>${ps.map(s=>`<div class="row" style="margin-top:10px"><b>${s.m}</b><b>${s.p}%</b></div><div class="bar"><i style="width:${s.p}%;background:${col(s.p)}"></i></div>`).join("")}</div>
 ${window.gap>=2?`<div class="gold"><div class="row"><span style="font-size:30px">⏰</span><h3>Ça fait ${window.gap} jours que tu n'as pas révisé. 5 min de révision ?</h3></div><p>Petite révision ciblée, gros effet sur ton prochain quiz.</p><button class="btn alt" style="width:auto;padding:10px 16px" onclick="tb('quiz')">Réviser maintenant</button></div>`:""}
 <h2 style="margin-top:20px">Progression générale</h2><div class="card g3">${ring(ps[0].p,"Maths")}${ring(ps[1].p,"Physique")}${ring(all,"Global")}</div>
 <h2>Tes matières</h2><div class="g3">${ps.map(s=>`<div class="tile" onclick="${s.p||s.m==="Maths"||s.m==="Physique-Chimie"?"tb('cours')":"toast('Contenu bientôt disponible')"}"><div style="font-size:24px">${s.i}</div><b>${s.m}</b><p>${s.p}% • Cours</p></div>`).join("")}</div>
 <h2 style="margin-top:20px">Accès rapide</h2><div class="g3" style="grid-template-columns:1fr 1fr"><div class="tile" style="background:#4b3600" onclick="tb('quiz')">⏱️<h3>Lancer un quiz</h3><p>5 QCM • 5:00</p></div><div class="tile" onclick="tb('cours')">📖<h3>Voir les cours</h3><p>Togo BAC D</p></div></div>
 <h2 style="margin-top:20px">Dernières ressources</h2>${FICHES.filter(x=>x.p).map(x=>`<div class="card row" style="cursor:pointer" onclick="gof('${x.id}')"><div><b>${x.t}</b><p>${x.m} • ${x.min} min</p></div><span>›</span></div>`).join("")}
 <button class="btn" style="background:linear-gradient(90deg,#8B5CF6,#EC4899);color:#fff" onclick="tb('dip')">🏆 Voir ma célébration</button><button class="btn ghost" onclick="out()">Me déconnecter</button>`}
function cours(){if(openF){const x=FICHES.find(y=>y.id===openF);return `<button class="btn ghost" style="text-align:left" onclick="openF=null;view()">← Retour</button><h2>${x.t}</h2><p>${x.m} • ${x.min} min</p>${x.p?`<div class="card"><h3>🧮 Formules clés</h3><p style="color:#fff">${x.f}</p><h3 style="margin-top:14px">📗 À retenir</h3>${x.p.map(t=>`<p style="margin:8px 0">• ${t}</p>`).join("")}<h3 style="margin-top:14px">💡 Méthode</h3><p>${x.me}</p></div>`:`<div class="card"><p>Le contenu de cette fiche est en cours de rédaction.</p></div>`}`}
 const ms=[...new Set(FICHES.map(x=>x.m))];return `<h2 style="margin-top:18px">Cours & Fiches</h2><p>Gratuit : 2 premières fiches par matière. Le reste est réservé Premium.</p>`+ms.map(m=>`<h3 style="margin-top:18px">${m}</h3>`+FICHES.filter(x=>x.m===m).map(x=>{const ok=x.free||prem();return `<div class="card" onclick="${ok?`rd('${x.id}')`:"tb('prem')"}" style="cursor:pointer"><span class="pill ${x.free?"g":""}">${x.free?"Gratuit":"🔒 Premium"}</span><h3 style="margin-top:8px">${x.t}</h3>${ok?`<p>${x.min||""} min • ${done().includes(x.id)?"✅ lue":"à lire"}</p>`:`<p class="lock">Débloque cette fiche avec Premium</p>`}</div>`}).join(""))}
window.rd=id=>{openF=id;const x=FICHES.find(y=>y.id===id);if(x.p&&!done().includes(id))save({done:[...done(),id]});view();scrollTo(0,0)};
function quiz(){if(!Q)return `<div class="gold" style="text-align:center;margin-top:18px"><div style="font-size:54px">📝</div><h1>Examens Blancs & Quiz</h1><p>Quiz gratuit : 5 questions • 5 minutes</p></div><div class="card"><p>⏱️ Pas de pause, comme le jour J.</p><p>✅ Correction immédiate après chaque réponse.</p><p>🔀 Questions et réponses mélangées à chaque essai.</p></div><button class="btn" onclick="sq()">▶ Commencer l'épreuve</button>`;
 if(Q.end){const s=Q.score;boom2(s);return `<div style="text-align:center;margin-top:24px"><div style="font-size:64px">${s>=4?"🏆":"💪"}</div><h1>${s>=4?"Bravo, excellent !":"Continue, tu progresses !"}</h1><div class="gold"><h1 style="font-size:54px">${s}/5</h1><p>${s*2}/10 points</p></div><p>${s>=4?"Ton diplôme de révision est débloqué.":"Relis les fiches, puis relance un quiz."}</p></div><button class="btn" onclick="sq()">🔀 Recommencer — Nouvel ordre</button><button class="btn alt" onclick="tb('cours')">Voir les cours</button>`}
 const q=Q.qs[Q.i],m=String(Math.floor(Q.left/60)).padStart(2,"0")+":"+String(Q.left%60).padStart(2,"0");
 return `<div class="top" style="margin-top:18px"><button class="btn ghost" style="width:auto;margin:0" onclick="tb('quiz')">✕ Quitter</button><b id="tm">⏱ ${m}</b></div><div class="bar"><i style="width:${(Q.i+(Q.a!==null?1:0))/5*100}%"></i></div><p>Question ${Q.i+1} / 5 • Maths</p><h2>${q.q}</h2>${q.o.map((o,i)=>`<button class="opt ${Q.a!==null?(o.ok?"ok":i===Q.a?"bad":""):""}" ${Q.a!==null?"disabled":""} onclick="pk(${i})">${"ABCD"[i]}. ${o.t}</button>`).join("")}${Q.a!==null?`<div class="card"><h3>${q.o[Q.a].ok?"✅ Bonne réponse !":"❌ À revoir"}</h3><p>${q.e}</p><button class="btn alt" onclick="nx()">${Q.i<4?"Question suivante →":"Voir mon résultat"}</button></div>`:""}`}
const boom2=s=>{if(s>=4&&!Q.fired){Q.fired=1;setTimeout(boom,200)}};
window.sq=()=>{Q={qs:shuffle(QS).map(q=>({...q,o:shuffle(q.o.map((t,i)=>({t,ok:i===0})))})),i:0,score:0,a:null,left:300};clearInterval(tm);tm=setInterval(()=>{if(!Q||Q.end)return clearInterval(tm);Q.left--;const e=$("#tm");if(e)e.textContent="⏱ "+String(Math.floor(Q.left/60)).padStart(2,"0")+":"+String(Q.left%60).padStart(2,"0");if(Q.left<=0){Q.end=1;fin();view()}},1000);view()};
window.pk=i=>{if(Q.a!==null)return;Q.a=i;if(Q.qs[Q.i].o[i].ok)Q.score++;view()};
window.nx=()=>{if(Q.i<4){Q.i++;Q.a=null}else{Q.end=1;fin()}view();scrollTo(0,0)};
const fin=()=>{clearInterval(tm);if(Q.score>(P?.best||0))save({best:Q.score})};
function premV(){return `<h2 style="margin-top:18px">Pass Premium</h2><div class="gold"><h1>${PRIX}</h1><p>pour ${JOURS} jours</p></div>
 <div class="card"><p>✅ Toutes les fiches de cours</p><p>✅ Corrigés complets et points de méthode</p><p>✅ Quiz et examens blancs complets</p></div>
 ${prem()?`<div class="card"><h3>Ton Premium est actif 👑</h3><p>Jusqu'au ${P.premiumUntil.toDate().toLocaleDateString("fr-FR")}</p></div>`:`<button class="btn" onclick="toast('Le paiement mobile money arrive bientôt.')">Payer ${PRIX}</button><p style="text-align:center;margin-top:10px">Paiement par ${P?.operator||"mobile money"}. Le Premium s'active automatiquement après le paiement.</p>`}`}
function dip(){const ok=(P?.best||0)>=4;if(ok&&!window.d1){window.d1=1;setTimeout(boom,300)}
 return ok?`<div style="text-align:center;margin-top:24px"><div style="font-size:70px">🎓</div><p class="logo" style="letter-spacing:3px">DIPLÔME DE RÉVISION</p><h1 style="margin:8px 0">Objectif atteint !</h1><div class="card"><h2>${esc(P.name)}</h2><p style="color:var(--gold);font-weight:800">BAC D • Togo</p><p style="font-size:26px">⭐⭐⭐⭐⭐</p><p>Félicitations, ton travail a payé !</p></div></div><button class="btn" onclick="sh()">Partager ma réussite</button><button class="btn ghost" onclick="tb('cours')">Retour à la révision</button>`
 :`<div style="text-align:center;margin-top:30px"><div style="font-size:64px">🔒</div><h1>Ton diplôme t'attend</h1><p>Obtiens au moins 4/5 à un quiz pour le débloquer.<br>Ton meilleur score : ${P?.best||0}/5.</p></div><button class="btn" onclick="tb('quiz')">Lancer un quiz</button>`}
window.sh=()=>{const t="J'ai atteint mon objectif de révision du BAC D sur BAC Réussite International !";navigator.share?navigator.share({title:"BAC Réussite",text:t,url:location.href}).catch(()=>{}):open("https://wa.me/?text="+encodeURIComponent(t+" "+location.href))};
window.toast=toast;
</script></body></html>
